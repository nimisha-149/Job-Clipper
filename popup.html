<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{width:340px;margin:0;padding:18px;font:14px Arial,sans-serif;background:#f5f7fb;color:#182238}
h2{margin:0 0 5px;color:#263b80}p{color:#64708a;margin:0 0 14px}.field{margin:10px 0}
label{display:block;font-weight:600;margin-bottom:5px}input,textarea{width:100%;padding:9px;border:1px solid #ccd4e2;border-radius:8px;font:inherit;background:white}
button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}
.primary{background:#4059c8;color:white;width:100%;margin-top:8px}.secondary{background:#e6eaff;color:#3049ad;width:100%;margin-top:8px}
#msg{margin-top:10px;font-size:12px;color:#18794e;min-height:15px}
</style></head><body>
<h2>Job Clipper</h2><p>Save this opportunity to your application board.</p>
<div class="field"><label for="role">Job role</label><input id="role" placeholder="e.g. Data Analyst Intern"></div>
<div class="field"><label for="company">Company</label><input id="company" placeholder="e.g. Nova Labs"></div>
<div class="field"><label for="deadline">Application deadline</label><input id="deadline" type="date"></div>
<div class="field"><label for="url">Job page link</label><input id="url" placeholder="Current page URL"></div>
<button class="primary" id="save">Save this job</button>
<button class="secondary" id="board">Open application board</button>
<div id="msg"></div>
<script src="popup.js"></script></body></html>
